<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${editando} ? 'Editar transferencia' : 'Nueva transferencia'">Transferencia</title>
</head>
<body>
<section>
    <div class="card">                       
        <div class="card-header">
            <h3 class="card-title" th:text="${editando} ? 'Editar transferencia' : 'Registrar transferencia'"></h3>
        </div>

        <form th:action="${editando} ? @{/transferencias/{id}(id=${idTransferencia})} : @{/transferencias}"
              th:object="${transferenciaForm}" method="post">
            
            <div class="card-body">
                <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                    <p class="mb-0" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
                </div>

                <th:block th:if="${!editando}">
                    <div class="form-group">
                        <label>Cuenta origen</label>
                        <select class="form-control" th:field="*{idCuentaOg}">
                            <option value="">[seleccionar cuenta origen]</option>
                            <option th:each="c : ${cuentas}" th:value="${c.id}" th:text="${c.nombreCuenta}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cuenta destino</label>
                        <select class="form-control" th:field="*{idCuentaDes}">
                            <option value="">[seleccionar cuenta destino]</option>
                            <option th:each="c : ${cuentas}" th:value="${c.id}" th:text="${c.nombreCuenta}"></option>
                        </select>
                    </div>
                </th:block>

                <div class="form-group">
                    <label>Monto</label>
                    <input type="number" min="0.01" step="0.01" class="form-control" th:field="*{monto}">
                </div>

                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" class="form-control" th:field="*{fecha}">
                </div>
            </div>

            <div class="card-footer">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/transferencias}" class="btn btn-default">Cancelar</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
