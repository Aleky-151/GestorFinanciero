<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nuevo gasto</title></head>
<body>
    <h1>Registrar gasto</h1>

    <form th:action="@{/gastos}" th:object="${gastoForm}" method="post">

        <div th:if="${#fields.hasGlobalErrors()}" style="color:red">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <p>
            <label>Cuenta</label><br>
            <select th:field="*{idCuenta}">
                <option value="">-- elige --</option>
                <option th:each="c : ${cuentas}" th:value="${c.id}" th:text="${c.nombreCuenta}"></option>
            </select>
            <span th:errors="*{idCuenta}" style="color:red"></span>
        </p>

        <p>
            <label>Categoría</label><br>
            <select th:field="*{idCategoria}">
                <option value="">-- elige --</option>
                <option th:each="k : ${categorias}" th:value="${k.id}" th:text="${k.categoria}"></option>
            </select>
            <span th:errors="*{idCategoria}" style="color:red"></span>
        </p>

        <p>
            <label>Descripción</label><br>
            <input type="text" th:field="*{descripcion}">
            <span th:errors="*{descripcion}" style="color:red"></span>
        </p>

        <p>
            <label>Monto</label><br>
            <input type="number" step="0.01" th:field="*{monto}">
            <span th:errors="*{monto}" style="color:red"></span>
        </p>

        <p>
            <label>Fecha</label><br>
            <input type="date" th:field="*{fecha}">
            <span th:errors="*{fecha}" style="color:red"></span>
        </p>

        <button type="submit">Guardar</button>
        <a th:href="@{/cuentas}">Cancelar</a>
    </form>
</body>
</html>
