<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Nuevo gasto</title></head>
<body>
<section>
    <div class="card">
        <div class="card-header"><h3 class="card-title">Registrar gasto</h3></div>

        <form th:action="@{/gastos}" th:object="${gastoForm}" method="post">
            <div class="card-body">

                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                </div>

                <div class="form-group">
                    <label>Cuenta</label>
                    <select class="form-control" th:field="*{idCuenta}">
                        <option value="">[seleccionar cuenta]</option>
                        <option th:each="c : ${cuentas}" th:value="${c.id}" th:text="${c.nombreCuenta}"></option>
                    </select>
                    <small class="text-danger" th:errors="*{idCuenta}"></small>
                </div>

                <div class="form-group">
                    <label>Categoría</label>
                    <select class="form-control" th:field="*{idCategoria}">
                        <option value="">[seleccionar categoria]</option>
                        <option th:each="k : ${categorias}" th:value="${k.id}" th:text="${k.categoria}"></option>
                    </select>
                    <small class="text-danger" th:errors="*{idCategoria}"></small>
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" class="form-control" th:field="*{descripcion}">
                    <small class="text-danger" th:errors="*{descripcion}"></small>
                </div>

                <div class="form-group">
                    <label>Monto</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{monto}">
                    <small class="text-danger" th:errors="*{monto}"></small>
                </div>

                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" class="form-control" th:field="*{fecha}">
                    <small class="text-danger" th:errors="*{fecha}"></small>
                </div>
            </div>
        </form>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/cuentas}" class="btn btn-default">Cancelar</a>
        </div>
    </div>
</section>
</body>
</html>
