<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Editar movimiento</title>
</head>
<body>
    <section>
        <div class="card">
            <div class="card-header"
                <h3 class="card-title">Editar movimiento</h3>
            </div>
            
        <form th:action="@{/movimientos/{id}(id=${movimientoForm.id})}" th:object="${movimientoForm}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="card-body">
                <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                    <p class="mb-0" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
                </div>
                 
                <div class="form-group">
                    <label>Categoría</label>
                    <select class="form-control" th:field="*{idCategoria}">
                        <option th:each="k : ${categorias}" th:value="${k.id}" th:text="${k.categoria}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" class="form-control" th:field="*{descripcion}">
                </div>

                <div class="form-group">
                    <label>Monto</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{monto}">
                </div>

                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" class="form-control" th:field="*{fecha}">
                </div>
            </div>
            <div class="card-footer"
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/movimientos}" class="btn btn-default">Cancelar</a>
            </div>
            </form>
        </div>
    </section>
</body>
</html>
