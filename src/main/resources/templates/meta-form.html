<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Meta</title>
</head>
<body>
<section>
    <div class="card">
        <div class="card-header">
            <h3 class="card-title" th:text="${metaForm.idMeta == null} ? 'Nueva meta' : 'Editar meta'"></h3>
        </div>
        
        <form th:action="${metaForm.idMeta == null} ? @{/metas} : @{/metas/{id}(id=${metaForm.idMeta})}"
              th:object="${metaForm}" method="post">

            <input type="hidden" th:field="*{idMeta}">
            <div class="card-body">
                <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                    <p class="mb-0" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
                </div>
                
                <div class="form-group">
                    <label>Meta Financiera</label>
                    <input type="text" class="form-control" th:field="*{nombreMeta}">
                </div>
                
                <div class="form-group" th:if="${metaForm.idMeta == null}">
                    <label>Monto Objetivo</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{montoObjetivo}">
                </div>
                
                <div class="form-group">
                    <label>Fecha Limite</label>
                    <input type="date" class="form-control" th:field="*{fechaLimite}">
                </div>
                
                <div class="form-group">
                    <label>Tipo</label>
                    <select class="form-control" th:field="*{idTipo}">
                        <option value="">[seleccionar tipo]</option>
                        <option th:each="k : ${tipos}" th:value="${k.id}" th:text="${k.tipo}"></option>
                    </select>
                </div>
                
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/metas}" class="btn btn-default">Cancelar</a>
                </div>
        </form>
    </div>
</section>
</body>
</html>
