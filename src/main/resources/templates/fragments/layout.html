<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">Mis finanzas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="hold-transition sidebar-mini layout-fixed sidebar-no-expand">
<div class="wrapper">

    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto">
            <li class="nav-item dropdown">
                <a class="nav-link d-flex align-items-center" data-toggle="dropdown" href="#" role="button">
                    <span class="d-none d-md-inline mr-2" th:text="${usuarioActual.nombreCompleto}">Nombre</span>
                    <span class="avatar-circle" th:text="${usuarioActual.iniciales}">A</span>
                    <i class="fas fa-chevron-down ml-2 small text-muted"></i>
                    
                </a>
                <div class="dropdown-menu dropdown-menu-right">
                    <span class="dropdown-item-text">
                        <strong class="d-block" th:text="${usuarioActual.nombreCompleto}">Nombre</strong>
                        <small class="text-muted" th:text="${'@' + usuarioActual.username}">@usuario</small>
                    </span>
                    <div class="dropdown-divider"></div>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item">
                            <i class="fas fa-sign-out-alt mr-2"></i> Cerrar sesión
                        </button>
                    </form>
                </div>
            </li>
        </ul>
    </nav>

    <!-- Sidebar -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <div class="sidebar-head d-flex align-items-center">
            <a th:href="@{/cuentas}" class="brand-link flex-grow-1">
                <i class="fas fa-wallet brand-image"></i>
                <span class="brand-text font-weight-light">Mis finanzas</span>
            </a>
        </div>
        
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
		    <li class="nav-item" th:each="op : ${menu}"
       	 		th:classappend="${op.tieneHijos() and op.activo(rutaActual)} ? 'menu-open'">

        		<a th:if="${!op.tieneHijos()}" th:href="@{${op.url()}}" class="nav-link"
          			th:classappend="${op.activo(rutaActual)} ? 'active'">
         		 	<i th:class="${'nav-icon ' + op.icono()}"></i>
            			<p th:text="${op.nombre()}"></p>
        		</a>

        <!-- grupo con submenú -->
        <th:block th:if="${op.tieneHijos()}">
            <a href="#" class="nav-link" th:classappend="${op.activo(rutaActual)} ? 'active'">
                <i th:class="${'nav-icon ' + op.icono()}"></i>
                <p>[[${op.nombre()}]] <i class="right fas fa-angle-left"></i></p>
            </a>
            <ul class="nav nav-treeview">
                <li class="nav-item" th:each="h : ${op.hijos()}">
                    <a th:href="@{${h.url()}}" class="nav-link"
                       th:classappend="${h.activo(rutaActual)} ? 'active'">
                        <i class="far fa-circle nav-icon"></i>
                        <p th:text="${h.nombre()}"></p>
                    </a>
                </li>
            </ul>
        </th:block>
    </li>
</ul>
            </nav>
        </div>
    </aside>

    <!-- Contenido de cada página -->
    <div class="content-wrapper">
        <section class="content pt-3">
            <div class="container-fluid">
                <div th:replace="${contenido}"></div>
            </div>
        </section>
    </div>

    <footer class="main-footer"><strong>Gestor financiero</strong></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
</body>
</html>
