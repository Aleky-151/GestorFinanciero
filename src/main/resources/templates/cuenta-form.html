<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cuenta</title></head>
<body>
    <h1 th:text="${cuentaForm.idCuenta == null} ? 'Nueva cuenta' : 'Editar cuenta'"></h1>

    <form th:action="${cuentaForm.idCuenta == null} ? @{/cuentas} : @{/cuentas/{id}(id=${cuentaForm.idCuenta})}"
          th:object="${cuentaForm}" method="post">

        <input type="hidden" th:field="*{idCuenta}">

        <div th:if="${#fields.hasGlobalErrors()}" style="color:red">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>
	<div th:if="${#fields.hasErrors('*')}" style="color:red">
    	    <p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
	</div>
        <p>
            <label>Nombre de la cuenta</label><br>
            <input type="text" th:field="*{nombreCuenta}">
            <span th:errors="*{nombreCuenta}" style="color:red"></span>
        </p>

        <p>
            <label>Tipo de cuenta</label><br>
            <select th:field="*{idCategoria}">
                <option value="">-- elige --</option>
                <option th:each="k : ${categorias}" th:value="${k.id}" th:text="${k.categoria}"></option>
            </select>
            <span th:errors="*{idCategoria}" style="color:red"></span>
        </p>

        <p th:if="${cuentaForm.idCuenta == null}">
            <label>Saldo inicial</label><br>
            <input type="number" step="0.01" th:field="*{saldo}">
            <span th:errors="*{saldo}" style="color:red"></span>
        </p>

        <button type="submit">Guardar</button>
        <a th:href="@{/cuentas}">Cancelar</a>
    </form>
</body>
</html>
