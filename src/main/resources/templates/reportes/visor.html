<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
    <head>
        <title>Ver reporte</title>
    </head>
    
<body>
<section>
    <div class= "card">
    <div class="card-header py-3 px-4 d-flex justify-content-between align-items-center flex-wrap">
        <div class="pe-3" style="flex: 1; min-width: 250px;">
            <h3 class="card-title float-none d-block m-0 fw-bold" th:text="${reporte.nombre()}" style="font-size: 1.5rem;">
            </h3>
            <p class="text-muted mt-2 mb-0" th:text="${reporte.descripcion()}">
            </p>
        </div>

        <div class="mt-2 mt-md-0">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/reportes(categoria=${reporte.categoria()})}">
                <i class="fas fa-arrow-left me-1"></i> Volver
            </a>
        </div>

    </div> 
    <div class="card-body">    
        <form class="form-inline mb-0" method="get" th:if="${reporte.usaFechas()}"
              th:action="@{/reportes/{id}(id=${reporte.id()})}">

            <label class="mr-2 mb-0" for="desde">Desde</label>
            <input type="date" id="desde" name="desde" class="form-control mr-3" th:value="${desde}">

            <label class="mr-2 mb-0" for="hasta">Hasta</label>
            <input type="date" id="hasta" name="hasta" class="form-control mr-4" th:value="${hasta}">

            <button type="submit" class="btn btn-primary mr-2">
                <i class="fas fa-sync-alt"></i> Generar
            </button>

            <a class="btn btn-success btn-sm"
               th:href="@{/reportes/{id}/pdf(id=${reporte.id()}, desde=${desde}, hasta=${hasta}, descargar=true)}"
               style="margin-top: 2px;"> 
                <i class="fas fa-download"></i> Descargar PDF
            </a>

        </form>    
    </div>
    </div>    
        <iframe title="Vista previa del reporte"
                th:src="@{/reportes/{id}/pdf(id=${reporte.id()}, desde=${desde}, hasta=${hasta})}"
                style="width:100%; height:75vh; border:1px solid #ccc; border-radius:4px;"></iframe>

</section>
</body>
</html>
