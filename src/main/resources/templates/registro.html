<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
    <div class="register-box">
        <div class="card card-outline">
            <div class="card-header text-center">
                <h3 class="card-title mt-2" style="font-size:1.5rem">Crear cuenta</h3>
            </div>
            <div class="card-body">                
                <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                    <p class="mb-0" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
                </div>
                
                <form th:action="@{/registro}" th:object="${registroForm}" method="post">
                    <div class="form-group mb-3">
                        <label style="font-size:1rem">Nombres</label>
                        <input type="text" name="nombres" class="form-control" th:field="*{nombres}" style="font-size:1rem">
                    </div>

                    <div class="form-group mb-3">
                        <label style="font-size:1rem">Apellido paterno</label>
                        <input type="text" name="apPaterno" class="form-control" th:field="*{apPaterno}" style="font-size:1rem">
                    </div>

                    <div class="form-group mb-4">
                         <label style="font-size:1rem">Apellido materno</label>
                        <input type="text" name="apMaterno" class="form-control" th:field="*{apMaterno}" style="font-size:1rem">
                    </div>
                    <hr class="my-3">
                    <div class="form-group mb-3">
                        <label style="font-size:1rem">Usuario</label>
                        <input type="text" name="username" class="form-control" th:field="*{usuario}" style="font-size:1rem">
                    </div>

                    <div class="form-group mb-3">
                        <label style="font-size:1rem">Clave</label>
                        <div class="input-group">
                            <input type="password" id="clave" class="form-control" th:field="*{clave}" placeholder="Mínimo 8 caracteres" style="font-size:1rem">
                            <div class="input-group-append">
                                <button type="button" class="btn btn-outline-secondary" id="toggleClave" tabindex="-1">
                                    <i class="fas fa-eye" id="iconoClave"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <hr class="my-3">
                    
                    <button type="submit" class="btn btn-primary btn-block">Registrarme</button> 
                    <p class="mt-3 mb-0 text-center"><a th:href="@{/login}">Ya tengo cuenta</a></p>
                </form>
            </div>
        </div>
    </div>
    <script>
    document.getElementById('toggleClave').addEventListener('click', function () {
        const campo = document.getElementById('clave');
        const icono = document.getElementById('iconoClave');
        const oculto = campo.type === 'password';
        campo.type = oculto ? 'text' : 'password';
        icono.className = oculto ? 'fas fa-eye-slash' : 'fas fa-eye';
    });
    </script>
</body>
</html>
