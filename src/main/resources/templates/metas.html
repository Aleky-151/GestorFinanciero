<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">>
<head>
	<title>Metas financieras</title>
</head>
<body>
<section>
    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class= "card">
	<div class="card-header py-4 px-4 d-flex align-items-start flex-wrap">
            <h3 class="card-title float-none m-0" style="font-size:1.5rem">Mis metas financieras</h3>

            <div class="ml-auto d-flex flex-column align-items-end">

                <form th:action="@{/metas}" method="get" class="form-inline mb-2">
                    <label class="mr-2 mb-0" for="estado">Estado</label>
                    <select id="estado" name="estado" class="form-control form-control-sm"
                            onchange="this.form.submit()">
                        <option value="">Todos</option>
                        <option th:each="e : ${estados}" th:value="${e.id}" th:text="${e.estado}"
                                th:selected="${estadoSel != null and estadoSel.id == e.id}"></option>
                    </select>
                </form>

                <div>
                    <a th:href="@{/metas/aportar}" class="btn btn-sm btn-outline-success mr-1">
                        <i class="fas fa-plus-circle"></i> Aportar
                    </a>
                    <a th:href="@{/metas/retirar}" class="btn btn-sm btn-outline-secondary mr-1">
                        <i class="fas fa-arrow-circle-up"></i> Retirar
                    </a>
                    <a th:href="@{/metas/nuevo}" class="btn btn-sm btn-primary">
                        <i class="fas fa-plus"></i> Nueva meta
                    </a>
                </div>
            </div>      
        </div>
        <div class="card-body table-responsive p-0">
            <table class="table table-hover text-nowrap">
                <thead>
                    <tr><th>Meta Financiera</th>
                        <th class="text-center">Tipo</th>
                        <th class="text-center">Estado</th>
                        <th class="text-center">Fecha Limite</th>
                        <th class="text-right">Monto Objetivo</th>
                        <th class="text-right">Saldo</th>
                    </tr>
                </thead>
                <tbody>
                        <tr th:each="f : ${metas}">
                        <td th:text="${f.meta().nombreMeta}"></td>
                        <td class="text-center" th:text="${f.meta().tipo.tipo}"></td>
                        <td class="text-center">
                            <form th:if="${f.meta().estado.id == 1}">
                            <span class="badge badge-info" th:text="${f.meta().estado.estado}"></span></form>
               
                            <form th:if="${f.meta().estado.id == 2}">
                            <span class="badge badge-success" th:text="${f.meta().estado.estado}"></span></form>
                            
                            <form th:if="${f.meta().estado.id > 2}">
                            <span class="badge badge-secondary" th:text="${f.meta().estado.estado}"></span></form>
                        </td>
                        <td class="text-center" th:text="${#temporals.format(f.meta().fechaLimite, 'dd/MM/yyyy')}"></td>   
                        <td class="text-right" th:text="${'S/ ' + #numbers.formatDecimal(f.meta().montoObjetivo, 1, 2)}"></td>
                        
                        <td class="text-right" 
                            th:class="'text-right ' + (${f.saldoRetirado()} ? 'text-secondary')"
                            th:text="${f.saldoRetirado() ? '[Retirado]' : 'S/ ' + #numbers.formatDecimal(f.meta().saldo, 1, 2)}">
                        </td>
                        
                        <td class="text-right">
                            <form th:if="${f.meta().estado.id != 4}"
                                  th:action="@{/metas/{id}/editar(id=${f.meta().id})}" method="get" class="d-inline">
                                <button class="btn btn-sm btn-outline-secondary">Editar</button>
                            </form>                          
                            
                            <button th:if="${(f.meta().estado.id == 1 or f.meta().estado.id == 3) and f.meta().saldo.signum() > 0}"
                                    type="button" class="btn btn-sm btn-outline-secondary btn-anular"
                                    title="Anular meta"
                                    data-toggle="modal" data-target="#modalAnular"
                                    th:attr="data-url=@{/metas/{id}/anular(id=${f.meta().id})},
                                             data-nombre=${f.meta().nombreMeta},
                                             data-saldo=${#numbers.formatDecimal(f.meta().saldo, 1, 2)}">
                                <i class="fas fa-ban" aria-hidden="true"></i>
                            </button>                            
                            
                            <form th:if="${f.meta().estado.id == 4}"
                                  th:action="@{/metas/{id}/editar(id=${f.meta().id})}" method="get" class="d-inline"
                                  onsubmit="return confirm('¿Desea retomar la meta? Se le redirigirá a Editar Meta para confirmar los datos.')">
                                <button class="btn btn-sm btn-outline-secondary">Retomar</button>
                            </form>
                            
                            <form th:if="${(!f.tieneAportes()) or (f.tieneAportes() and f.meta().saldo.signum()== 0)}"
                                  th:action="@{/metas/{id}/eliminar(id=${f.meta().id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar definitivamente?')">
                                <button class="btn btn-sm btn-outline-danger" title="Eliminar meta">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </form>       
                                              
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(metas)}">
                        <td colspan="5" class="text-center text-muted py-4">Aún no hay metas registradas.</td>
                    </tr>                </tbody>
            </table>
	</div>
    </div>
    <div class="modal fade" id="modalAnular" tabindex="-1">
        <div class="modal-dialog">
            <form method="post" id="formAnular" class="modal-content">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="modal-header">
                    <h5 class="modal-title">Anular meta</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">&times;</button>
                </div>

                <div class="modal-body">
                    <p>
                        Se devolverán <strong>S/ <span id="anularSaldo"></span></strong>
                        de «<span id="anularNombre"></span>».
                    </p>
                    <div class="form-group mb-0">
                        <label for="anularCuenta">¿A qué cuenta quieres devolver el dinero?</label>
                        <select id="anularCuenta" name="idCuenta" class="form-control" required>
                            <option value="">[seleccionar cuenta destino]</option>
                            <option th:each="c : ${cuentas}" th:value="${c.id}" th:text="${c.nombreCuenta}"></option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Volver</button>
                    <button type="submit" class="btn btn-warning">Anular meta</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.querySelectorAll('.btn-anular').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.getElementById('formAnular').action = btn.dataset.url;
                document.getElementById('anularNombre').textContent = btn.dataset.nombre;
                document.getElementById('anularSaldo').textContent = btn.dataset.saldo;
                document.getElementById('anularCuenta').value = '';   
            });
        });
    </script>
</section>
</body>
</html>
