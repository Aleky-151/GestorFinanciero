<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="card card-outline">
        <div class="card-header text-center">
            <h1 class="h3 mt-4">Mis finanzas</h1>
            <p class="mt-2 mb-0">Iniciar Sesión</p>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${param.error}">Usuario o clave incorrectos</div>
            <div class="alert alert-success" th:if="${param.logout}">Cerraste sesión</div>
            <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

            <form th:action="@{/login}" method="post">
                <div class="input-group mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Usuario">
                    <div class="input-group-append"><div class="input-group-text"><span class="fas fa-user"></span></div></div>
                </div>
                <div class="input-group mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Clave">
                    <div class="input-group-append"><div class="input-group-text"><span class="fas fa-lock"></span></div></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>
            <p class="mt-3 mb-0 text-center"><a th:href="@{/registro}">Crear cuenta</a></p>
        </div>
    </div>
</div>
</body>
</html>
